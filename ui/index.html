<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora · 本地自主智能体控制台</title>
<style>
  :root {
    /* ---- Color tokens ---- */
    --c-bg: #0f1115;
    --c-surface: #171a21;
    --c-surface-2: #1f232c;
    --c-border: #2a2f3a;
    --c-text: #e6e9ef;
    --c-text-muted: #9aa3b2;
    --c-accent: #4f8cff;
    --c-accent-soft: rgba(79, 140, 255, 0.14);
    --c-accent-line: rgba(79, 140, 255, 0.35);
    --c-ok: #3fb950;
    --c-ok-soft: rgba(63, 185, 80, 0.16);
    --c-ok-line: rgba(63, 185, 80, 0.4);
    --c-warn: #d29922;
    --c-err: #f85149;
    --c-err-soft: rgba(248, 81, 73, 0.16);
    /* ---- Shape / motion tokens ---- */
    --radius-sm: 6px;
    --radius: 10px;
    --radius-pill: 999px;
    --dur-fast: 120ms;
    --dur: 200ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    /* ---- Type tokens ---- */
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    --fs-xs: 11px;
    --fs-sm: 12.5px;
    --fs-base: 14px;
    --fs-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--c-bg);
    color: var(--c-text);
    font-family: var(--font-sans);
    font-size: var(--fs-base);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--c-border);
    background: var(--c-surface);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-lg); letter-spacing: 0.2px; }
  .brand svg { color: var(--c-accent); }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-xs); color: var(--c-text-muted);
    border: 1px solid var(--c-border); border-radius: var(--radius-pill);
    padding: 3px 10px; background: var(--c-surface-2);
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .pill .led { width: 6px; height: 6px; border-radius: 50%; background: var(--c-text-muted); }
  .pill.live { color: var(--c-ok); border-color: var(--c-ok-line); }
  .pill.live .led { background: var(--c-ok); }

  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .side { display: none; } }

  .chat { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 20px 18px; }
  .msg { margin-bottom: 16px; max-width: 820px; }
  .msg .who {
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--c-text-muted); margin-bottom: 5px;
  }
  .bubble {
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: var(--radius); padding: 10px 13px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--c-accent-soft); border-color: var(--c-accent-line); }

  /* Tool-call timeline */
  .trace { margin: 8px 0 0; padding-left: 14px; border-left: 2px solid var(--c-border); }
  .step {
    position: relative; padding: 7px 10px; margin: 6px 0;
    background: var(--c-surface-2); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: var(--fs-sm);
    border-left: 3px solid var(--c-border);
  }
  .step.tool { border-left-color: var(--c-accent); }
  .step.observe { border-left-color: var(--c-text-muted); color: var(--c-text-muted); }
  .step.final { border-left-color: var(--c-ok); }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: var(--fs-xs); font-family: var(--font-sans);
    padding: 1px 7px; border-radius: var(--radius-pill); margin-right: 6px;
  }
  .badge.ok { background: var(--c-ok-soft); color: var(--c-ok); }
  .badge.fail { background: var(--c-err-soft); color: var(--c-err); }
  .badge.tool { background: var(--c-accent-soft); color: var(--c-accent); }
  .badge svg { width: 11px; height: 11px; }

  .composer {
    display: flex; gap: 10px; padding: 12px 18px;
    border-top: 1px solid var(--c-border); background: var(--c-surface);
  }
  textarea {
    flex: 1; resize: none; height: 54px; background: var(--c-bg); color: var(--c-text);
    border: 1px solid var(--c-border); border-radius: var(--radius); padding: 10px 12px;
    font-family: var(--font-sans); font-size: var(--fs-base);
    transition: border-color var(--dur) var(--ease);
  }
  textarea:focus { border-color: var(--c-accent); outline: none; }
  button {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--c-accent); color: #fff; border: none; border-radius: var(--radius);
    padding: 0 18px; font-weight: 600; cursor: pointer; font-size: var(--fs-base);
    font-family: var(--font-sans);
    transition: filter var(--dur-fast) var(--ease), opacity var(--dur) var(--ease);
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: var(--c-surface-2); color: var(--c-text); border: 1px solid var(--c-border); }
  button svg { width: 15px; height: 15px; }

  .side { border-left: 1px solid var(--c-border); background: var(--c-surface); display: flex; flex-direction: column; min-height: 0; }
  .side h3 {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.7px;
    color: var(--c-text-muted); margin: 0; padding: 14px 16px 8px;
  }
  .side h3 svg { width: 13px; height: 13px; }
  .kb { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .row { display: flex; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--c-border); }
  .row input {
    flex: 1; background: var(--c-bg); color: var(--c-text);
    border: 1px solid var(--c-border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .row input:focus { border-color: var(--c-accent); outline: none; }
  .meta { font-size: var(--fs-sm); color: var(--c-text-muted); padding: 4px 16px 12px; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; }
  .kv span:last-child { color: var(--c-text); font-family: var(--font-mono); }
  .empty { color: var(--c-text-muted); font-size: 13px; padding: 4px 0; }

  /* Scrollbars */
  .log::-webkit-scrollbar, .kb::-webkit-scrollbar { width: 9px; }
  .log::-webkit-scrollbar-thumb, .kb::-webkit-scrollbar-thumb {
    background: var(--c-border); border-radius: var(--radius-pill);
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"></path>
    </svg>
    <span>Aurora · 本地自主智能体</span>
  </div>
  <span class="pill" id="model-pill"><span class="led"></span>模型加载中</span>
  <span class="spacer"></span>
  <span class="pill" id="status-pill"><span class="led"></span>连接中</span>
</header>

<main>
  <section class="chat">
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="composer">
      <textarea id="input" placeholder="给 Aurora 下达任务，例如：写一个 hello.txt 并读回确认"></textarea>
      <button id="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
        发送
      </button>
    </div>
  </section>

  <aside class="side">
    <h3>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      知识库
    </h3>
    <div class="kb" id="kb-list"><div class="empty">尚未摄入文档</div></div>
    <div class="meta" id="kb-meta"></div>
    <div class="row">
      <input id="kb-path" placeholder="本地目录或文件路径" aria-label="知识库路径" />
      <button class="ghost" id="kb-ingest">摄入</button>
    </div>
    <h3>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v18h18"></path><path d="M18.7 8 13 13.7l-3-3L6 14.7"></path>
      </svg>
      运行时
    </h3>
    <div class="meta" id="stats"></div>
  </aside>
</main>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log");
let busy = false;

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>',
  cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>',
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 0 1-4-4l8-10z"></path></svg>',
};

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "你" : "Aurora"}</div><div class="bubble"></div>`;
  el.querySelector(".bubble").textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function ensureTrace() {
  let t = log.querySelector(".trace:last-of-type");
  if (!t) {
    t = document.createElement("div");
    t.className = "trace";
    log.appendChild(t);
  }
  return t;
}

function addStep(step) {
  const el = document.createElement("div");
  el.className = "step " + step.kind;
  let label = "";
  if (step.kind === "tool") {
    label = `<span class="badge tool">${ICON.wrench}调用</span>` + escapeHtml(step.tool || "");
    ensureTrace().appendChild(el);
  } else if (step.kind === "observe") {
    label = `<span class="badge ${step.ok ? "ok" : "fail"}">${step.ok ? ICON.check : ICON.cross}${step.ok ? "成功" : "失败"}</span>` + escapeHtml(step.tool ? step.tool + " · " : "");
    ensureTrace().appendChild(el);
  } else if (step.kind === "final") {
    label = `<span class="badge ok">${ICON.check}最终答复</span>`;
    ensureTrace().appendChild(el);
  }
  el.innerHTML = label + " " + escapeHtml(step.text || "");
  log.scrollTop = log.scrollHeight;
}

async function refreshStatus() {
  try {
    const r = await fetch("/api/health");
    const j = await r.json();
    const sp = $("#status-pill");
    sp.innerHTML = '<span class="led"></span>在线';
    sp.classList.add("live");
    $("#model-pill").innerHTML = '<span class="led"></span>Qwen2.5-7B + nomic';
    $("#kb-meta").textContent = "已索引片段: " + j.chunks;
    $("#stats").innerHTML =
      `<div class="kv"><span>推理设备</span><span>CPU</span></div>` +
      `<div class="kv"><span>知识片段</span><span>${j.chunks}</span></div>`;
  } catch (e) {
    const sp = $("#status-pill");
    sp.innerHTML = '<span class="led"></span>离线';
    sp.classList.remove("live");
  }
}

async function send() {
  if (busy) return;
  const input = $("#input");
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = "";
  busy = true;
  $("#send").disabled = true;
  addMessage("user", prompt);
  const probe = addMessage("aurora", "规划中…");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, stream: true }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    probe.remove();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith("data: ")) continue;
        const payload = JSON.parse(p.slice(6));
        if (payload.type === "done") {
          if (payload.answer) addMessage("aurora", payload.answer);
        } else {
          addStep(payload);
        }
      }
    }
  } catch (e) {
    probe.textContent = "请求失败: " + e.message;
    if (!probe.isConnected) addMessage("aurora", "请求失败: " + e.message);
  } finally {
    busy = false;
    $("#send").disabled = false;
    refreshStatus();
  }
}

async function ingest() {
  const path = $("#kb-path").value.trim();
  if (!path) return;
  const btn = $("#kb-ingest");
  btn.disabled = true;
  try {
    const r = await fetch("/api/knowledge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const j = await r.json();
    $("#kb-list").innerHTML = `<div class="empty">已摄入 ${j.ingested_chunks} 个片段</div>`;
    refreshStatus();
  } catch (e) {
    $("#kb-list").innerHTML = `<div class="empty">摄入失败: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

$("#send").addEventListener("click", send);
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });
$("#kb-ingest").addEventListener("click", ingest);
refreshStatus();
</script>
</body>
</html>
