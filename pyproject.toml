[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-agent"
version = "0.1.0"
description = "本地自主智能体系统 - 纯本机 CPU 运行，内置 RAG 与工具调用循环"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["ai", "agent", "llm", "rag", "llama.cpp", "local", "offline"]

dependencies = [
    "llama-cpp-python>=0.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
